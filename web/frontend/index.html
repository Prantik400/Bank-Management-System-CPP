<!doctype html>
<html lang="en">
  <head>
    <title>Bank System</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>

  <body>

    <div class="container">

      <!-- ===== LEFT PANEL ===== -->
      <div class="left-panel">
        <div class="brand">
          <i data-lucide="landmark"></i>
          <h1>Smart Bank</h1>
        </div>

        <p>Secure • Fast • Modern Banking Experience</p>

        <div class="features">
          <div><i data-lucide="zap"></i> Real-time Transactions</div>
          <div><i data-lucide="shield-check"></i> Secure Authentication</div>
          <div><i data-lucide="repeat"></i> Instant Transfers</div>
          <div><i data-lucide="settings"></i> Admin Control Panel</div>
        </div>
      </div>

      <!-- ===== RIGHT PANEL ===== -->
      <div class="login-container">
        <h2>Welcome Back</h2>
        <p>Login to your account</p>

        <!-- ACCOUNT -->
        <div class="input-group">
          <i data-lucide="user"></i>
          <input id="accountId" type="text" placeholder="Account ID or admin" />
        </div>

        <!-- PIN -->
        <div class="input-group">
          <i data-lucide="lock"></i>
          <input id="pin" type="password" placeholder="Enter PIN" />
        </div>

        <!-- ERROR -->
        <p id="errorMsg" class="error-msg"></p>

        <!-- BUTTON -->
        <button onclick="login()">
          <i data-lucide="log-in"></i> Login
        </button>
      </div>

    </div>

    <script src="script.js"></script>

    <!-- ICON INIT -->
    <script>
      window.addEventListener("load", () => {
        lucide.createIcons();
      });
    </script>

    <!-- ENTER KEY -->
    <script>
      document.addEventListener("keydown", function (e) {
        if (e.key === "Enter") login();
      });
    </script>
  </body>
</html>
