<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>

  <link rel="stylesheet" href="admin.css" />

  <!-- Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" />

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body>
<div class="dashboard">

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar">
    <h2>Admin Panel</h2>

    <ul>
      <li class="active" onclick="setActive(this); showTotal();">
        <i data-lucide="layout-dashboard"></i> Dashboard
      </li>

      <li onclick="setActive(this); showCreate();">
        <i data-lucide="user-plus"></i> Create
      </li>

      <li onclick="setActive(this); showAll();">
        <i data-lucide="users"></i> All Users
      </li>

      <li onclick="setActive(this); showDelete();">
        <i data-lucide="user-x"></i> Delete
      </li>

      <li onclick="logout()">
        <i data-lucide="log-out"></i> Logout
      </li>
    </ul>
  </div>

  <!-- ===== MAIN ===== -->
  <div class="main-content">
    <div class="content-area">

      <!-- ===== TOTAL ===== -->
      <div id="totalSection">
        <h1>Welcome, Admin</h1>

        <div class="card">
          <h3>Total Bank Balance</h3>
          <h2 id="totalBalance">₹ 0</h2>
        </div>
      </div>

      <!-- ===== CREATE ===== -->
      <div id="createSection" style="display:none;">
        <div class="card">
          <h3>Create Account</h3>

          <input id="newId" type="text" placeholder="User ID">
          <input id="newName" type="text" placeholder="Name">
          <input id="newPin" type="password" placeholder="PIN">

          <button onclick="createAccount()">Create</button>
        </div>
      </div>

      <!-- ===== DELETE ===== -->
      <div id="deleteSection" style="display:none;">
        <div class="card">
          <h3>Delete Account</h3>

          <input id="deleteId" type="text" placeholder="User ID">

          <button onclick="deleteAccount()">Delete</button>
        </div>
      </div>

      <!-- ===== ALL USERS ===== -->
      <div id="allSection" style="display:none;">
        <div class="card transaction-card">
          <h3>All Accounts</h3>

          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Balance</th>
              </tr>
            </thead>

            <tbody id="accountsTable"></tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">
      <p>© 2026 Bank System. All rights reserved.</p>

      <div class="socials">
        <a href="#"><i class="fa-solid fa-envelope"></i></a>
        <a href="#"><i class="fa-brands fa-linkedin"></i></a>
        <a href="#"><i class="fa-brands fa-github"></i></a>
      </div>
    </div>

  </div>
</div>

<script src="admin.js"></script>

<script>
  window.addEventListener("load", () => {
    lucide.createIcons();
    showTotal(); // default load
  });
</script>

</body>
</html>
